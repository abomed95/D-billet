# D-Billet Nginx configuration
# After installing this file, run:  sudo certbot --nginx -d d-billet.com -d www.d-billet.com
# Certbot will:
#   - inject the SSL block automatically
#   - convert the :80 server below into an HTTPS redirect

# --- Rate-limiting zones (defined at http{} level by /etc/nginx/conf.d) ---
# If these are not already present in your nginx.conf, add them in /etc/nginx/conf.d/dbillet-limits.conf:
#
#   limit_req_zone $binary_remote_addr zone=dbillet_auth:10m rate=10r/m;
#   limit_req_zone $binary_remote_addr zone=dbillet_api:10m  rate=60r/m;

# ============== HTTP -> HTTPS redirect (certbot will edit this) ==============
server {
    listen 80;
    listen [::]:80;
    server_name d-billet.com www.d-billet.com;

    # Let certbot serve ACME challenges
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ============== HTTPS site (filled in by certbot) ==============
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name d-billet.com www.d-billet.com;

    # SSL certificates (certbot will replace these paths)
    # ssl_certificate     /etc/letsencrypt/live/d-billet.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/d-billet.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/dbillet/frontend/build;
    index index.html;

    client_max_body_size 10M;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml application/json application/javascript
        application/xml+rss application/atom+xml image/svg+xml application/manifest+json;

    # --- Security headers ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Conservative CSP - keep 'unsafe-inline' for inline styles used by Tailwind/Radix.
    # Adjust 'connect-src' if you add new third-parties (Stripe, analytics...).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://accounts.google.com; frame-src https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self';" always;

    # --- API ---
    location = /api {
        limit_req zone=dbillet_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8001/api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    # Stricter limit on the auth endpoints
    location ~ ^/api/auth/(login|register|phone-login|otp) {
        limit_req zone=dbillet_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8001$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /api/ {
        limit_req zone=dbillet_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    location = /health {
        access_log off;
        proxy_pass http://127.0.0.1:8001/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Persistent uploads ---
    location /uploads/ {
        alias /var/www/dbillet/shared/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        # Prevent script execution from uploads directory
        location ~ \.(php|py|pl|sh|cgi)$ { return 403; }
    }

    # --- Cached static assets ---
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- Service worker must not be cached, so PWA updates roll out ---
    location = /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    location = /manifest.json {
        add_header Cache-Control "public, max-age=3600";
    }

    # --- SPA fallback ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}
