# Place this file at /etc/nginx/conf.d/dbillet-limits.conf
# Defines the rate-limiting zones referenced by the dbillet site config.

limit_req_zone $binary_remote_addr zone=dbillet_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=dbillet_api:10m  rate=60r/m;

# Return 429 (not 503) when a client hits the limit
limit_req_status 429;
